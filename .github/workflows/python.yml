name: Python

on:
  push:
    branches: [ main, feature/** ]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r DesktopAgent/requirements.txt
          pip install pytest ruff
      - name: Lint
        run: |
          ruff check DesktopAgent/agent/tools/wave_function_collapse.py \
                     DesktopAgent/agent/tools/voronoi_theme_generator.py \
                     DesktopAgent/agent/tools/simulated_annealing_placer.py \
                     DesktopAgent/agent/tools/graph_flow_analyzer.py \
                     DesktopAgent/agent/tools/batch_generator.py \
                     DesktopAgent/agent/tools/master_orchestrator.py \
                     DesktopAgent/tests
      - name: Test
        run: |
          pytest DesktopAgent/tests
